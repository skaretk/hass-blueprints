blueprint:
  name: Heatit Z-Dim / Z-Dim2
  description: >-
    This blueprint can be used for creation of a single automation
    for controlling a whole Heatit Z-Dim or Z-Dim2.

    Note: On the Z-Dim2, set parameter 6 (Rotary Wheel Press Functionality)
    and/or parameter 7 (External Switch Functionality) to
    "Scene controller function" to make the device send scene events.
  domain: automation
  source_url: https://github.com/skaretk/hass-blueprints/blob/main/blueprints/zwavejs_heatit_z-dim.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    zdim_device_id:
      name: Heatit Z-Dim / Z-Dim2
      description: The Heatit Z-Dim or Z-Dim2 to interact with
      selector:
        device:
          filter:
            - integration: zwave_js
              manufacturer: Heatit
              model: Z-Dim
            - integration: zwave_js
              manufacturer: Heatit
              model: Z-DIM2
    double_press:
      name: Button Pressed 2 times
      description: Action to run on button is pressed twice.
      default:
      selector:
        action: {}
    triple_press:
      name: Button Pressed 3 times
      description: Action to run on button is pressed three times.
      default:
      selector:
        action: {}
    four_press:
      name: Button Pressed 4 times
      description: Action to run on button is pressed four times.
      default:
      selector:
        action: {}
    five_press:
      name: Button Pressed 5 times
      description: Action to run on button is pressed five times.
      default:
      selector:
        action: {}

mode: single
triggers:
- trigger: event
  event_type: zwave_js_value_notification
  event_data:
    device_id: !input "zdim_device_id"
    command_class_name: Central Scene

actions:
- variables:
    button: "{{ trigger.event.data.property_key_name }}"
    button_action: "{{ trigger.event.data.value }}"
- choose:
  - conditions: "{{ button == '001' and button_action == 'KeyPressed2x' }}"
    sequence: !input "double_press"
  - conditions: "{{ button == '001' and button_action == 'KeyPressed3x' }}"
    sequence: !input "triple_press"
  - conditions: "{{ button == '001' and button_action == 'KeyPressed4x' }}"
    sequence: !input "four_press"
  - conditions: "{{ button == '001' and button_action == 'KeyPressed5x' }}"
    sequence: !input "five_press"
  default:
    - action: logbook.log
      data:
        name: Heatit Z-Dim / Z-Dim2
        message: Unhandled event
